# Pushing a tag like 1.2.3 (no "v", must equal manifest.json "version")
# creates a GitHub release with the files Obsidian downloads.
name: Release

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: write
  id-token: write      # artifact attestations (build provenance)
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # checkout turns annotated tags into lightweight ones; refetch to keep the message.
      - run: git fetch --force --tags

      - name: Tag must match manifest version
        run: |
          v=$(jq -r .version manifest.json)
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest.json version $v"
            exit 1
          fi

      # Lets users verify the assets were built from this repo. Free on public
      # repos; private repos on a personal plan don't support it, so don't fail.
      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            main.js
            manifest.json
            *.css

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="main.js manifest.json"
          [ -f styles.css ] && files="$files styles.css"
          gh release create "$GITHUB_REF_NAME" $files --title "$GITHUB_REF_NAME" --notes-from-tag
